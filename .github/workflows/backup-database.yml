name: Back up database

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export D1 database
        run: npx wrangler d1 export DB --remote --output backup.sql
      - name: Upload to R2
        run: |
          gzip backup.sql
          npx wrangler r2 object put "flawless-backups/d1/flawless-$(date -u +%Y-%m-%d).sql.gz" \
            --file backup.sql.gz --content-type application/gzip --remote
